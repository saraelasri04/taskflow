<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; color: #222; }

    .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { font-size: 24px; }

    button { cursor: pointer; padding: 8px 16px; border-radius: 6px; border: 1px solid #ccc; background: #fff; font-size: 14px; }
    #btn-create { background: #2563eb; color: #fff; border: none; }

    .project-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: flex-start; }
    .project-info h3 { font-size: 16px; margin-bottom: 6px; }
    .project-info p  { font-size: 13px; color: #666; margin-bottom: 8px; }
    .project-actions { display: flex; gap: 8px; }

    .badge { font-size: 11px; padding: 2px 10px; border-radius: 20px; display: inline-block; }
    .badge-actif    { background: #dcfce7; color: #166534; }
    .badge-en-pause { background: #fef9c3; color: #854d0e; }
    .badge-archivé  { background: #f3f4f6; color: #374151; }

    .deadline { font-size: 12px; color: #888; margin-left: 8px; }

    #pagination { display: flex; gap: 12px; align-items: center; margin-top: 16px; }
    #pagination button { padding: 6px 14px; }
    #pagination span   { font-size: 13px; color: #555; }

    .form { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .form-group input,
    .form-group textarea,
    .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    #btn-submit { background: #2563eb; color: #fff; border: none; }
    .btn-danger { background: #dc2626; color: #fff; border: none; }

    .delete-confirm { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 32px; text-align: center; }
    .delete-confirm h2 { margin-bottom: 12px; }
    .delete-confirm p  { margin-bottom: 8px; color: #444; }
    .warning { color: #b45309; font-size: 13px; }

    .error { color: #dc2626; font-size: 13px; margin-top: 8px; }
    .empty { color: #888; font-size: 14px; }
    .btn-edit   { background: #f3f4f6; }
    .btn-delete { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }
  </style>
</head>
<body>
  <div id="app">Chargement...</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
